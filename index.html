<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>subtitle-download - 链接音频转文字</title>
  <meta name="description" content="subtitle-download 是纯前端链接检测、音频捕获与本地转文字工具。">
  <link rel="canonical" href="https://subtitle-download.gitlcp.com/">
  <link rel="stylesheet" href="assets/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.18/dist/hls.min.js" defer></script>
  <script src="assets/subtitle-download.js" defer></script>
</head>
<body>
  <main class="shell compact-main">
    <section id="app" class="app-grid" aria-label="subtitle-download 应用">
      <div class="panel">
        <div class="panel-inner">
          <h1 class="compact-title">subtitle-download</h1>

          <div class="form-row">
            <label for="source-url">视频 / 音频链接</label>
            <input id="source-url" class="input" type="url" spellcheck="false" value="https://www.youtube.com/watch?v=gLvLqvVxIco" placeholder="https://www.youtube.com/watch?v=... 或 https://example.com/video.mp4">
            <div class="badges" style="margin-top:6px">
              <button type="button" class="badge" data-example="https://www.youtube.com/watch?v=gLvLqvVxIco">YouTube 示例</button>
              <button type="button" class="badge" data-example="https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4">MP4 示例</button>
              <button type="button" class="badge" data-example="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">MP3 示例</button>
              <button type="button" class="badge" data-example="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8">HLS 示例</button>
            </div>
          </div>

          <div class="controls-grid">
            <div class="form-row">
              <label for="language-select">识别语言</label>
              <select id="language-select" class="select">
                <option value="auto" selected>自动识别原文语言</option>
                <option value="zh">强制中文原文</option>
                <option value="en">强制英文原文</option>
              </select>
            </div>
            <div class="form-row">
              <label for="model-select">本地模型</label>
              <select id="model-select" class="select">
                <option value="tiny" selected>Whisper Tiny（最快）</option>
                <option value="base">Whisper Base（较准，较慢）</option>
              </select>
            </div>
            <div class="form-row">
              <label for="capture-seconds">捕获时长 / 秒</label>
              <input id="capture-seconds" class="input" type="number" min="0" max="14400" value="0" style="font-family:inherit" title="0 表示不按秒数截断，直到视频结束或手动停止">
              <div class="field-hint">0 = 全长；填数字 = 只捕获指定秒数。</div>
            </div>
            <div class="form-row">
              <label for="segment-seconds">分段转写 / 秒</label>
              <input id="segment-seconds" class="input" type="number" min="5" max="120" value="10" style="font-family:inherit" title="长视频会边录边按这个长度切段转文字">
              <div class="field-hint">默认 10 秒：更快追加完整文本。</div>
            </div>
            <div class="form-row">
              <label for="playback-rate">捕获播放倍速</label>
              <select id="playback-rate" class="select">
                <option value="1">1x 最稳</option>
                <option value="1.25">1.25x</option>
                <option value="1.5">1.5x</option>
                <option value="2" selected>2x 极速</option>
              </select>
              <div class="field-hint">中文识别不稳时改 1x；追求速度用 2x。</div>
            </div>
            <div class="form-row hidden">
              <label for="timestamp-mode">输出模式</label>
              <select id="timestamp-mode" class="select">
                <option value="fast" selected>纯文本输出</option>
              </select>
            </div>
          </div>

          <div class="actions single-action">
            <button id="one-click-btn" class="btn btn-green" type="button">开始检测、捕获并转文字</button>
            <button id="inspect-btn" class="btn btn-primary hidden" type="button">检测链接并尝试播放</button>
            <button id="auto-btn" class="btn btn-green hidden" type="button">检测后自动捕获并转文字</button>
            <button id="prewarm-btn" class="btn btn-outline hidden" type="button">预热模型缓存</button>
            <button id="capture-start-btn" class="btn btn-amber hidden" type="button">开始捕获媒体音频</button>
            <button id="capture-tab-btn" class="btn btn-amber hidden" type="button">捕获当前标签页音频</button>
            <button id="capture-stop-btn" class="btn btn-dark hidden" type="button">停止并识别</button>
          </div>

          <div class="status-grid" aria-label="链接检测结果">
            <div class="status-card"><div class="status-label">链接类型</div><div id="check-type" class="status-value pending">未检测</div></div>
            <div class="status-card"><div class="status-label">连接</div><div id="check-connect" class="status-value pending">未检测</div></div>
            <div class="status-card"><div class="status-label">可操作</div><div id="check-control" class="status-value pending">未检测</div></div>
            <div class="status-card"><div class="status-label">可播放</div><div id="check-play" class="status-value pending">未检测</div></div>
            <div class="status-card"><div class="status-label">可捕获音频</div><div id="check-capture" class="status-value pending">未检测</div></div>
          </div>

          <div class="progress-stack" aria-label="处理进度">
            <div class="progress-box">
              <div class="progress-top"><span id="overall-label">总进度</span><span id="overall-percent">0%</span></div>
              <div class="track"><div id="overall-bar" class="bar"></div></div>
              <p id="overall-detail" class="subtle" style="margin:8px 0 0;font-size:13px">等待检测。</p>
            </div>
            <div class="progress-box">
              <div class="progress-top"><span id="audio-label">音频提取</span><span id="audio-percent">0%</span></div>
              <div class="track"><div id="audio-bar" class="bar"></div></div>
              <p id="audio-detail" class="subtle" style="margin:8px 0 0;font-size:13px">等待捕获。</p>
            </div>
            <div class="progress-box">
              <div class="progress-top"><span id="asr-label">ASR 识别</span><span id="asr-percent">0%</span></div>
              <div class="track"><div id="asr-bar" class="bar"></div></div>
              <p id="asr-detail" class="subtle" style="margin:8px 0 0;font-size:13px">等待捕获完成；模型会在后台预热缓存。</p>
            </div>
          </div>

          <div id="native-panel" class="media-shell">
            <video id="media-element" controls crossorigin="anonymous" playsinline></video>
          </div>
          <div id="youtube-panel" class="media-shell hidden">
            <div id="youtube-player" style="width:100%;height:100%"></div>
          </div>

          <div class="downloads single-download">
            <button id="download-audio-btn" class="btn btn-outline hidden" type="button">下载音频</button>
            <button id="download-txt-btn" class="btn btn-outline" type="button">下载 TXT</button>
            <button id="download-srt-btn" class="btn btn-outline hidden" type="button">下载 SRT</button>
          </div>
        </div>
      </div>

      <aside class="output-stack">
        <div class="panel">
          <div class="panel-inner">
            <h3>识别结果</h3>
            <textarea id="transcript-output" class="textarea result-textarea" readonly placeholder="这里只显示纯文本，不显示时间戳。长视频会按分段持续追加，直到全部完成。"></textarea>
          </div>
        </div>
        <div class="panel">
          <div class="panel-inner">
            <h3>实时诊断日志</h3>
            <div id="diagnostics-log" class="log" data-empty="true"><div class="line">[等待] 粘贴链接后点击“开始检测、捕获并转文字”。</div></div>
          </div>
        </div>
        <textarea id="srt-output" class="hidden" readonly></textarea>
      </aside>
    </section>
  </main>
</body>
</html>
